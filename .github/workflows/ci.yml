name: CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'api/**'
      - 'android/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'api/**'
      - 'android/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Build & Test (Ktor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: api

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run API Unit Tests & Build ShadowJar
        env:
          # Giả lập biến môi trường để chạy unit test độc lập không cần database thật (TASK-004)
          JWT_SECRET: ci-dummy-jwt-secret-min-32-chars-long-for-testing
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          LIVEKIT_URL: wss://ci-fake.livekit.cloud
          LIVEKIT_API_KEY: ci-fake-api-key
          LIVEKIT_API_SECRET: ci-fake-api-secret
          R2_ACCOUNT_ID: ci-fake-account
          R2_ACCESS_KEY_ID: ci-fake-key
          R2_SECRET_ACCESS_KEY: ci-fake-secret
          R2_BUCKET_NAME: skillexchange-dev
          R2_PUBLIC_DOMAIN: https://ci-fake.r2.dev
          FIREBASE_PROJECT_ID: ci-fake-project
        run: ./gradlew test build

  android:
    name: Android Build & Unit Test (Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Tests & Assemble Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

